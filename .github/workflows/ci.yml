name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig (via zvm)
        run: |
          curl -L https://raw.githubusercontent.com/tristanisham/zvm/master/install.sh | bash
          export PATH=$HOME/.zvm/bin:$HOME/.zvm/self:$PATH
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH
          # Install and use Zig master (dev)
          zvm install master
          zvm use master

      - name: Install Just
        run: |
          if ! command -v just &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          fi

      - name: Build
        run: zig build --summary all --verbose

      - name: Run Tests
        run: zig build test --summary all --verbose

      - name: Run Inspector Verification
        run: |
          zig build run --summary all --verbose -- inspect ci/fixtures/parquet/simple.parquet
          zig build run --summary all --verbose -- inspect ci/fixtures/parquet/required.parquet

