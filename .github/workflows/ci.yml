name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyarrow

      - name: Generate Fixtures
        run: python3 tools/fixtures/gen.py

      - name: Read .zig-version
        id: zig-version
        run: echo "version=$(cat .zig-version)" >> $GITHUB_OUTPUT

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - name: Build
        run: zig build

      - name: Run Tests
        run: zig build test

      - name: Run Inspector Verification
        run: |
          zig build run -- inspect data/simple.parquet
          zig build run -- inspect data/required.parquet

