name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.zig"
      - "build.zig.zon"
      - "vendor/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.zig"
      - "build.zig.zon"
      - "vendor/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    # High-Performance Parallel CI:
    # 1. ARM64: Runs on your high-performance self-hosted box (for benchmarks).
    # 2. x86_64: Runs on GitHub's free infrastructure (for Intel/AMD compatibility).
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            runs-on: [self-hosted, Linux, ARM64, zpq-arm]
            target: aarch64-linux
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-linux
          - name: macos-arm64
            runs-on: macos-latest
            target: aarch64-macos
          - name: macos-x86_64
            runs-on: macos-latest
            target: x86_64-macos

    steps:
      - uses: actions/checkout@v4

      - name: Set up anyzig
        run: |
          echo "::group::Installing anyzig"
          ARCH=$(uname -m)
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          if [ "$ARCH" = "arm64" ]; then ARCH="aarch64"; fi

          if [ "$OS" = "darwin" ]; then
            URL="https://github.com/marler8997/anyzig/releases/latest/download/anyzig-${ARCH}-macos.tar.gz"
          else
            URL="https://github.com/marler8997/anyzig/releases/latest/download/anyzig-${ARCH}-linux.tar.gz"
          fi

          # Install to workspace to avoid polluting self-hosted runner
          mkdir -p $GITHUB_WORKSPACE/zig-bin
          curl -fsSL "$URL" | tar -xz -C $GITHUB_WORKSPACE/zig-bin

          # anyzig releases contain a binary named 'zig' (verified)
          echo "$GITHUB_WORKSPACE/zig-bin" >> $GITHUB_PATH
          echo "::endgroup::"

      - name: Verify Zig Version
        run: |
          # anyzig will automatically download the version specified in build.zig.zon
          # if it's not already in the cache.
          zig version

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Cache Zig Global Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: ${{ runner.os }}-${{ matrix.name }}-zig-${{ hashFiles('build.zig', 'vendor/*/build.zig') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-zig-

      - name: Fetch Pre-built Dependencies from R2
        id: fetch-deps
        run: |
          echo "::group::Fetching pre-built BoringSSL libraries from Cloudflare R2"
          TARGET="${{ matrix.target }}"
          echo "TARGET=$TARGET" >> $GITHUB_OUTPUT
          echo "Target: $TARGET"

          # Fetch from Cloudflare R2 (public, no auth needed)
          R2_URL="https://pub-4d2e7e2925bb43dc9d3c0323d6d61a84.r2.dev/boring_tls/${TARGET}"
          mkdir -p vendor/boring_tls/prebuilt/$TARGET

          echo "Fetching libcrypto.a..."
          curl -fsSL "${R2_URL}/libcrypto.a" -o "vendor/boring_tls/prebuilt/${TARGET}/libcrypto.a" || true
          echo "Fetching libssl.a..."
          curl -fsSL "${R2_URL}/libssl.a" -o "vendor/boring_tls/prebuilt/${TARGET}/libssl.a" || true

          # Verify downloads (check file size > 1KB to ensure not error page)
          # Use stat -f%z on macOS, stat -c%s on Linux
          if [ -f "vendor/boring_tls/prebuilt/${TARGET}/libcrypto.a" ] && \
             [ -f "vendor/boring_tls/prebuilt/${TARGET}/libssl.a" ]; then
            SIZE=$(stat -f%z "vendor/boring_tls/prebuilt/${TARGET}/libcrypto.a" 2>/dev/null || \
                   stat -c%s "vendor/boring_tls/prebuilt/${TARGET}/libcrypto.a" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 1000 ]; then
              echo "Successfully fetched pre-built dependencies from R2"
              echo "CACHE_HIT=true" >> $GITHUB_OUTPUT
              ls -la vendor/boring_tls/prebuilt/${TARGET}/
            else
              echo "Pre-built deps not available on R2, will build from source (~3 min)"
              echo "CACHE_HIT=false" >> $GITHUB_OUTPUT
              rm -f vendor/boring_tls/prebuilt/${TARGET}/*.a 2>/dev/null || true
            fi
          else
            echo "Pre-built deps not available on R2, will build from source (~3 min)"
            echo "CACHE_HIT=false" >> $GITHUB_OUTPUT
          fi
          echo "::endgroup::"

      - name: Build
        run: |
          # Build only the binaries needed for CI verification and benchmarks.
          # We build 'zpq' and 'bench-e2e' in ReleaseFast.
          zig build -Doptimize=ReleaseFast install bench-e2e --summary all 2>&1

          # Fast check of probes and tests in Debug mode to ensure no regressions
          # We use 'zig build check' and -Dall=true to verify the whole codebase.
          zig build check -Dall=true -Dexamples=true --summary all 2>&1

          echo "Build artifacts:"
          ls -laR zig-out/

      # Laziness Principle: if we built from source, upload to R2 so next run is faster
      - name: Upload Built Dependencies to R2
        if: steps.fetch-deps.outputs.CACHE_HIT == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          TARGET="${{ matrix.target }}"
          echo "::group::Uploading built BoringSSL to R2 for $TARGET"

          # Find built libraries in zig-cache (hash varies per build)
          LIBCRYPTO=$(find .zig-cache -name "libcrypto.a" -type f 2>/dev/null | head -1)
          LIBSSL=$(find .zig-cache -name "libssl.a" -type f 2>/dev/null | head -1)

          if [ -z "$LIBCRYPTO" ] || [ -z "$LIBSSL" ]; then
            echo "No built libraries found in .zig-cache, skipping upload"
            echo "::endgroup::"
            exit 0
          fi

          echo "Found libcrypto.a: $LIBCRYPTO"
          echo "Found libssl.a: $LIBSSL"

          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Uploading libcrypto.a..."
          aws s3 cp "$LIBCRYPTO" \
            "s3://zpq/boring_tls/${TARGET}/libcrypto.a" \
            --endpoint-url "$R2_ENDPOINT"

          echo "Uploading libssl.a..."
          aws s3 cp "$LIBSSL" \
            "s3://zpq/boring_tls/${TARGET}/libssl.a" \
            --endpoint-url "$R2_ENDPOINT"

          echo "Successfully uploaded to R2 - next CI run will be faster!"
          echo "::endgroup::"

      - name: Run Tests
        run: |
          echo "Running Tests (ZSTD Enabled)"
          zig build test --summary all 2>&1

          echo "Running Tests (ZSTD Disabled)"
          zig build test -Dzstd-compression=false --summary all 2>&1

      - name: Run CLI Verification
        run: |
          # Find the built zpq binary
          ZPQ_BIN=$(find zig-out -name zpq -type f | head -1)
          if [ -z "$ZPQ_BIN" ]; then
            echo "Error: zpq binary not found in zig-out"
            exit 1
          fi
          echo "Using binary: $ZPQ_BIN"

          echo "Testing --schema on simple.parquet..."
          "$ZPQ_BIN" ci/fixtures/parquet/simple.parquet --schema
          echo "Testing --meta on required.parquet..."
          "$ZPQ_BIN" ci/fixtures/parquet/required.parquet --meta
          echo "All verifications passed!"

      - name: Run R2 Benchmarks
        if: startsWith(matrix.target, 'aarch64-linux') || startsWith(matrix.target, 'x86_64-linux')
        env:
          S3_ENDPOINT: ${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "R2 credentials not configured, skipping benchmarks"
            exit 0
          fi
          # Unified benchmark dispatcher
          export AWS_S3_BUCKET="zpq"
          ./tools/bench.sh native s3 null 1mb 1
          ./tools/bench.sh native s3 null 10mb 1
          ./tools/bench.sh native s3 null 100mb 1

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zpq-${{ matrix.target }}
          path: zig-out/bin/zpq
          retention-days: 7
