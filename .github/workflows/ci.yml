name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            runs-on: ubuntu-latest
            zig-arch: x86_64-linux
          - arch: aarch64-linux
            runs-on: ubuntu-latest-4-cores-arm
            zig-arch: aarch64-linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyarrow

      - name: Generate Fixtures
        run: python3 tools/fixtures/gen.py

      - name: Set up Zig
        run: |
          ZIG_VERSION=$(cat .zig-version)
          ZIG_ARCH="${{ matrix.zig-arch }}"
          # Fetch download URL from ziglang.org JSON API
          if [ "$ZIG_VERSION" = "master" ]; then
            ZIG_URL=$(curl -s https://ziglang.org/download/index.json | jq -r ".master.\"${ZIG_ARCH}\".tarball")
          else
            ZIG_URL=$(curl -s https://ziglang.org/download/index.json | jq -r ".\"${ZIG_VERSION}\".\"${ZIG_ARCH}\".tarball")
          fi
          echo "Downloading Zig ${ZIG_VERSION} for ${ZIG_ARCH} from: $ZIG_URL"
          curl -L "$ZIG_URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          mv zig-* zig
          echo "$(pwd)/zig" >> $GITHUB_PATH

      - name: Build
        run: zig build

      - name: Run Tests
        run: zig build test

      - name: Run Inspector Verification
        run: |
          zig build run -- inspect data/simple.parquet
          zig build run -- inspect data/required.parquet

