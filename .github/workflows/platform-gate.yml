name: Platform gate

# Every landing, natively on every shipped platform: the full tier, shard by shard, on Linux x86 and ARM and on Apple
# silicon and Intel Macs, and the release packaging path (release.yml) with publishing off. It runs on every push to
# main or an integ/* branch and every pull request to them, whatever paths the change touches: packaging and docs
# changes ship too.
#
# A landing runs the runner:shard pairs in GATE, those proven green here, and the packaging. The rest are piloted:
# a dispatch with pilot runs every pair not yet in GATE, and the Windows jobs; a pair joins GATE once a pilot run
# shows it green. A dispatch with stale_man_pin runs only the packaging, on a commit with a stale manual pin, and
# must fail.
#
# Each job builds cold (no build cache), passes the runner's physical memory as --maxrss and its core count as -j,
# and records what it took (.github/ci/resources.py) next to its receipts.
#
# Not here, by name: the clickbench shard, whose ~14 GB of partitions don't fit a hosted runner's disk; it runs on
# the fleet's build hosts (tools/check/fleet.sh). The canonical shard is also inside corpus, so it isn't run twice.

on:
  push:
    branches: [main, "integ/**"]
  pull_request:
    branches: [main, "integ/**"]
  workflow_dispatch:
    inputs:
      pilot:
        description: "Run the pairs not yet in GATE, and the Windows jobs, instead of the landing gate"
        type: boolean
        default: false
      stale_man_pin:
        description: "Rehearsal: package with the manual's pin from before its 0.6.1 re-pin, which must fail"
        type: boolean
        default: false

env:
  GATE: >-
    ubuntu-24.04:units-core ubuntu-24.04:units ubuntu-24.04:cases ubuntu-24.04:corpus ubuntu-24.04:os
    ubuntu-24.04:cpu ubuntu-24.04:libzpq
    ubuntu-24.04-arm:units-core ubuntu-24.04-arm:units ubuntu-24.04-arm:corpus ubuntu-24.04-arm:os
    ubuntu-24.04-arm:cpu ubuntu-24.04-arm:libzpq
    macos-15:units macos-15:corpus macos-15:cpu
    macos-15-intel:units-core macos-15-intel:units macos-15-intel:corpus macos-15-intel:cpu

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          MODE: ${{ inputs.stale_man_pin && 'rehearsal' || inputs.pilot && 'pilot' || 'gate' }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json, os
          runners = ["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "macos-15-intel"]
          shards = ["units-core", "units", "cases", "corpus", "os", "cpu", "libzpq"]
          every = [f"{r}:{s}" for r in runners for s in shards]
          gate = os.environ["GATE"].split()
          assert set(gate) <= set(every), sorted(set(gate) - set(every))
          pick = {"gate": [p for p in every if p in gate], "pilot": [p for p in every if p not in gate],
                  "rehearsal": []}[os.environ["MODE"]]
          print("matrix=" + json.dumps({"include": [dict(zip(("runner", "shard"), p.split(":"))) for p in pick]}))
          PY

  full-tier:
    name: Full tier (${{ matrix.runner }}, ${{ matrix.shard }})
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.matrix).include[0] }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.14'

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          use-cache: false

      # A runner's network fails now and then (a DNS miss stopped one cold build), so the packages come first, retried.
      - name: Fetch the build's packages
        continue-on-error: true
        run: for i in 1 2 3; do zig build --fetch=all && exit 0; sleep 30; done; exit 1

      # CLI cases use GNU timeout, which is not in the macOS default PATH.
      - name: Install GNU timeout on macOS
        if: runner.os == 'macOS'
        run: |
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Runner facts and paths
        run: |
          python3 .github/ci/resources.py facts >> "$GITHUB_ENV"
          echo "PY=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
          echo "ORACLE=$HOME/.cache/zpq-duckdb2/bin-2.0.1/duckdb" >> "$GITHUB_ENV"
          cat "$GITHUB_ENV"

      - name: Create Python test environment
        run: |
          python3 -m venv .venv
          "$PY" -m pip install --quiet --no-input -r tools/check/requirements.txt

      # The oracle: DuckDB 2.0.1's CLI for this runner, pinned to the digest GitHub lists for the release asset, at
      # the default path, which the stages that don't take -Dduckdb (cpu-parity) find it by.
      - name: Install DuckDB 2.0.1
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=linux-amd64 sum=b676268be4d39e4e41a904442c9796c9914e645cc085c7505f048f2c992b5eca ;;
            Linux-ARM64) asset=linux-arm64 sum=84e37891fcc45c887e30220f51a4914995cd8174139e87f8efd311ac83c956a7 ;;
            macOS-ARM64) asset=osx-arm64 sum=7809dc1ea9215db53f76bdd539e38186c2310b6a3b5800581bf65876048556aa ;;
            macOS-X64) asset=osx-amd64 sum=f63131b6e1e69ded1a55e0b96f2f1d77658e4cf5b666346487c927820a4d53c5 ;;
            *) echo "no DuckDB pin for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          mkdir -p "$(dirname "$ORACLE")" && cd "$(dirname "$ORACLE")"
          curl -fsSLo cli.tar.gz "https://github.com/duckdb/duckdb/releases/download/v2.0.1/duckdb-cli-$asset.tar.gz"
          if command -v sha256sum >/dev/null; then echo "$sum  cli.tar.gz" | sha256sum -c -; else echo "$sum  cli.tar.gz" | shasum -a 256 -c -; fi
          tar -xzf cli.tar.gz
          "$ORACLE" --version

      - name: Full tier shard
        run: >-
          "$PY" .github/ci/resources.py run "${{ matrix.runner }}-${{ matrix.shard }}" --
          zig build check -Dtier=full -Dshard=${{ matrix.shard }} -Dduckdb="$ORACLE" -Dpython="$PY"
          -j"$cores" --maxrss "$mem" --summary all

      - name: Keep the receipts and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.runner }}-${{ matrix.shard }}
          path: |
            zig-out/receipts
            ci-metrics
          if-no-files-found: warn

  # What runs on Windows today. Zig doesn't build zpq natively on a Windows host yet (zpq-check and the generated
  # test roots don't compile there), so a Linux runner cross-builds the ReleaseSafe test executables and the shipped
  # ReleaseFast CLI, and the Windows runner runs them from the repository root, where their fixtures are, with the
  # CLI at .\zpq.exe for the fake-S3 test. The full tier's shards need zpq-check and don't run on Windows.
  windows-build:
    name: Windows cross-build
    if: ${{ inputs.pilot && !inputs.stale_man_pin }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          use-cache: false

      # A runner's network fails now and then (a DNS miss stopped one cold build), so the packages come first, retried.
      - name: Fetch the build's packages
        continue-on-error: true
        run: for i in 1 2 3; do zig build --fetch=all && exit 0; sleep 30; done; exit 1

      - name: Runner facts
        run: python3 .github/ci/resources.py facts >> "$GITHUB_ENV"

      - name: Build the test executables and the CLI for Windows
        run: |
          python3 .github/ci/resources.py run windows-cross-build -- sh -c "
            zig build test-bin -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe --prefix zig-out/win \
              -j$cores --maxrss $mem --summary all &&
            zig build cli -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseFast -Dstrip=true -Drevision=$GITHUB_SHA \
              --prefix zig-out/win -j$cores --maxrss $mem --summary all"
          cd zig-out/win/bin && for f in zpq-core-test zpq-cli-test; do mv "$f" "$f.exe"; done && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: zig-out/win/bin

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-windows-cross-build
          path: ci-metrics
          if-no-files-found: warn

  windows:
    name: Windows native (core, CLI, smoke)
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/download-artifact@v4
        with:
          name: windows-bin
          path: win

      - name: Python test environment
        run: |
          python .github/ci/resources.py facts
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --quiet --no-input -r tools/check/requirements.txt

      # Git's bash by full path (the PATH may find WSL's first); the venv's python relative, as fixtures.sh resolves it.
      - name: Fixtures
        run: |
          PYTHON=.venv/Scripts/python.exe .venv/Scripts/python.exe .github/ci/resources.py run windows-fixtures -- \
            "$(cygpath -m "$BASH")" tools/check/fixtures.sh

      - name: Shipped CLI
        run: |
          cp win/zpq.exe zpq.exe
          ./zpq.exe --version
          ./zpq.exe --version | grep -q "$GITHUB_SHA"

      - name: Core tests
        run: .venv/Scripts/python.exe .github/ci/resources.py run windows-core -- win/zpq-core-test.exe

      - name: CLI tests
        if: ${{ !cancelled() }}
        run: .venv/Scripts/python.exe .github/ci/resources.py run windows-cli -- win/zpq-cli-test.exe

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-windows-native
          path: ci-metrics
          if-no-files-found: warn

  version:
    name: Release version
    if: ${{ !inputs.pilot || inputs.stale_man_pin }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"

  # The release path itself (release.yml): every target built and packaged, the archives smoked natively, the
  # checksums and release.json assembled; dry_run keeps it from publishing. release.yml's publishing job asks for
  # contents: write, which a called workflow may only have if its caller grants it; with dry_run it publishes nothing,
  # and the call passes no secrets.
  # The stale_man_pin rehearsal packages a throwaway commit that restores the manual's pin from before 0.6.1's re-pin:
  # the packaging must refuse it.
  packaging:
    name: Packaging
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ github.sha }}
      dry_run: true
      prepare: >-
        ${{ inputs.stale_man_pin && 'printf "%s  zpq.1\n%s  zpq.1.gz\n"
        6c2e8ed6cd101651c82a6f5e6d7316818bccf6a2408a58eb010f8b2bedd12cfe
        e046d47168e8b7962cfd6aeab53b144619c2229d414e5d27c2db343c2fbbb990 > packaging/man/zpq.1.gz.sha256 &&
        git -c user.name=rehearsal -c user.email=rehearsal@example.com commit -qam "rehearsal: stale man pin"' || '' }}
