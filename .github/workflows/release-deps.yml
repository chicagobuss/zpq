name: Build and Upload Dependencies

on:
  workflow_dispatch:
  push:
    tags:
      - "deps-*"

jobs:
  build-boring-ssl:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: ubuntu-latest
            target: aarch64-linux
          - os: macos-latest
            target: x86_64-macos
          - os: macos-latest
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          # Pin to specific Zig version for reproducibility
          version: 0.16.0-dev.1634+b27bdd5af

      - name: Build BoringSSL
        run: |
          cd vendor/boring_tls
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Duse-prebuilt=false -Dfetch-prebuilt=false --summary all

          # Prepare for upload
          mkdir -p prebuilt/${{ matrix.target }}
          cp zig-out/lib/libcrypto.a prebuilt/${{ matrix.target }}/
          cp zig-out/lib/libssl.a prebuilt/${{ matrix.target }}/
          ls -la prebuilt/${{ matrix.target }}/

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          cd vendor/boring_tls
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Uploading libcrypto.a for ${{ matrix.target }}..."
          aws s3 cp prebuilt/${{ matrix.target }}/libcrypto.a \
            s3://zpq/boring_tls/${{ matrix.target }}/libcrypto.a \
            --endpoint-url "$R2_ENDPOINT"

          echo "Uploading libssl.a for ${{ matrix.target }}..."
          aws s3 cp prebuilt/${{ matrix.target }}/libssl.a \
            s3://zpq/boring_tls/${{ matrix.target }}/libssl.a \
            --endpoint-url "$R2_ENDPOINT"

          echo "Done uploading ${{ matrix.target }}"
