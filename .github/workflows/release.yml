name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.0)"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read # Required for dawidd6/action-download-artifact to list CI runs
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            artifact: zpq-linux-x86_64
            ci_artifact: zpq-x86_64-linux
          - os: [self-hosted, Linux, ARM64, zpq-arm]
            target: aarch64-linux
            artifact: zpq-linux-arm64
            ci_artifact: zpq-aarch64-linux
          - os: macos-latest
            target: x86_64-macos
            artifact: zpq-macos-x86_64
            ci_artifact: zpq-x86_64-macos
          - os: macos-latest
            target: aarch64-macos
            artifact: zpq-macos-arm64
            ci_artifact: zpq-aarch64-macos

    steps:
      - uses: actions/checkout@v4

      # Try to download pre-built binary from CI (faster path)
      - name: Try CI Artifact
        id: ci-artifact
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          workflow: ci.yml
          branch: main
          name: ${{ matrix.ci_artifact }}
          path: ci-bin/
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Check CI Artifact
        id: check-ci
        run: |
          if [ -f "ci-bin/zpq" ]; then
            echo "Found CI artifact, using pre-built binary"
            echo "found=true" >> $GITHUB_OUTPUT
            chmod +x ci-bin/zpq
            mkdir -p zig-out/bin
            mv ci-bin/zpq zig-out/bin/zpq
            ls -la zig-out/bin/
          else
            echo "No CI artifact found, will build from source"
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      # Only run build steps if CI artifact not found
      - name: Set up anyzig
        if: steps.check-ci.outputs.found != 'true'
        run: |
          ARCH=$(uname -m)
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          if [ "$ARCH" = "arm64" ]; then ARCH="aarch64"; fi

          if [ "$OS" = "darwin" ]; then
            URL="https://github.com/marler8997/anyzig/releases/latest/download/anyzig-${ARCH}-macos.tar.gz"
          else
            URL="https://github.com/marler8997/anyzig/releases/latest/download/anyzig-${ARCH}-linux.tar.gz"
          fi

          mkdir -p $HOME/zig-bin
          curl -fsSL "$URL" | tar -xz -C $HOME/zig-bin
          echo "$HOME/zig-bin" >> $GITHUB_PATH

      - name: Fetch Pre-built BoringSSL
        if: steps.check-ci.outputs.found != 'true'
        run: |
          R2_URL="https://pub-4d2e7e2925bb43dc9d3c0323d6d61a84.r2.dev/boring_tls/${{ matrix.target }}"
          mkdir -p vendor/boring_tls/prebuilt/${{ matrix.target }}

          curl -fsSL "${R2_URL}/libcrypto.a" -o "vendor/boring_tls/prebuilt/${{ matrix.target }}/libcrypto.a" || true
          curl -fsSL "${R2_URL}/libssl.a" -o "vendor/boring_tls/prebuilt/${{ matrix.target }}/libssl.a" || true

          ls -la vendor/boring_tls/prebuilt/${{ matrix.target }}/

      - name: Build zpq
        if: steps.check-ci.outputs.found != 'true'
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast --summary all

          # Show binary info
          ls -la zig-out/bin/
          file zig-out/bin/zpq || true

      - name: Package CLI
        run: |
          mkdir -p dist
          cp zig-out/bin/zpq dist/
          cd dist
          tar -czvf ${{ matrix.artifact }}.tar.gz zpq
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz*

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release/

      - name: Upload to R2 (public access)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TAG="${GITHUB_REF#refs/tags/}"

          echo "Uploading release binaries to R2..."
          for file in release/*.tar.gz; do
            name=$(basename "$file")
            echo "Uploading $name..."
            aws s3 cp "$file" "s3://zpq/releases/${TAG}/${name}" --endpoint-url "$R2_ENDPOINT"
            # Also upload as "latest" for easy access
            aws s3 cp "$file" "s3://zpq/releases/latest/${name}" --endpoint-url "$R2_ENDPOINT"
          done
          echo "Done uploading to R2"

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ZPQ ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: release/*
          body: |
            ## ZPQ ${{ steps.tag.outputs.tag }}

            ### Downloads

            | Platform | Download |
            |----------|----------|
            | Linux x86_64 | [zpq-linux-x86_64.tar.gz](https://pub-4d2e7e2925bb43dc9d3c0323d6d61a84.r2.dev/releases/${{ steps.tag.outputs.tag }}/zpq-linux-x86_64.tar.gz) |
            | Linux ARM64 | [zpq-linux-arm64.tar.gz](https://pub-4d2e7e2925bb43dc9d3c0323d6d61a84.r2.dev/releases/${{ steps.tag.outputs.tag }}/zpq-linux-arm64.tar.gz) |
            | macOS x86_64 | [zpq-macos-x86_64.tar.gz](https://pub-4d2e7e2925bb43dc9d3c0323d6d61a84.r2.dev/releases/${{ steps.tag.outputs.tag }}/zpq-macos-x86_64.tar.gz) |
            | macOS ARM64 | [zpq-macos-arm64.tar.gz](https://pub-4d2e7e2925bb43dc9d3c0323d6d61a84.r2.dev/releases/${{ steps.tag.outputs.tag }}/zpq-macos-arm64.tar.gz) |

            ### Quick Start

            ```bash
            # Download and extract (Linux ARM64 example)
            curl -fsSL https://pub-4d2e7e2925bb43dc9d3c0323d6d61a84.r2.dev/releases/${{ steps.tag.outputs.tag }}/zpq-linux-arm64.tar.gz | tar -xz

            # View schema
            ./zpq myfile.parquet --schema

            # Filter and output
            ./zpq input.parquet output.parquet --filter "status=active" --select "id,name,email"
            ```

            ### Serverless Deployment

            See [examples/serverless/README.md](https://github.com/${{ github.repository }}/blob/main/examples/serverless/README.md) for AWS Lambda, Cloud Run, and other serverless deployments.
