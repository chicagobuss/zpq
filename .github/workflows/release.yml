name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.0)"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            artifact: zpq-linux-x86_64
            lambda_arch: x86_64
            ci_artifact: zpq-linux-x86_64
          - os: [self-hosted, Linux, ARM64, zpq-arm]
            target: aarch64-linux
            artifact: zpq-linux-arm64
            lambda_arch: arm64
            ci_artifact: zpq-linux-arm64
          # macOS builds (no CI artifacts available)
          - os: macos-latest
            target: x86_64-macos
            artifact: zpq-macos-x86_64
            lambda_arch: ""
            ci_artifact: ""
          - os: macos-latest
            target: aarch64-macos
            artifact: zpq-macos-arm64
            lambda_arch: ""
            ci_artifact: ""

    steps:
      - uses: actions/checkout@v4

      # Try to download pre-built binary from CI (faster path)
      - name: Try CI Artifact
        id: ci-artifact
        if: matrix.ci_artifact != ''
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          workflow: ci.yml
          branch: main
          name: ${{ matrix.ci_artifact }}
          path: ci-bin/
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Check CI Artifact
        id: check-ci
        run: |
          if [ -f "ci-bin/zpq" ]; then
            echo "Found CI artifact, using pre-built binary"
            echo "found=true" >> $GITHUB_OUTPUT
            chmod +x ci-bin/zpq
            mkdir -p zig-out/bin
            mv ci-bin/zpq zig-out/bin/zpq
            ls -la zig-out/bin/
          else
            echo "No CI artifact found, will build from source"
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      # Only run build steps if CI artifact not found
      - name: Set up anyzig
        if: steps.check-ci.outputs.found != 'true'
        run: |
          ARCH=$(uname -m)
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          if [ "$ARCH" = "arm64" ]; then ARCH="aarch64"; fi

          if [ "$OS" = "darwin" ]; then
            URL="https://github.com/marler8997/anyzig/releases/latest/download/anyzig-${ARCH}-macos.tar.gz"
          else
            URL="https://github.com/marler8997/anyzig/releases/latest/download/anyzig-${ARCH}-linux.tar.gz"
          fi

          mkdir -p $HOME/zig-bin
          curl -fsSL "$URL" | tar -xz -C $HOME/zig-bin
          echo "$HOME/zig-bin" >> $GITHUB_PATH

      - name: Fetch Pre-built BoringSSL
        if: steps.check-ci.outputs.found != 'true'
        run: |
          R2_URL="https://pub-4d2e7e2925bb43dc9d3c0323d6d61a84.r2.dev/boring_tls/${{ matrix.target }}"
          mkdir -p vendor/boring_tls/prebuilt/${{ matrix.target }}

          curl -fsSL "${R2_URL}/libcrypto.a" -o "vendor/boring_tls/prebuilt/${{ matrix.target }}/libcrypto.a" || true
          curl -fsSL "${R2_URL}/libssl.a" -o "vendor/boring_tls/prebuilt/${{ matrix.target }}/libssl.a" || true

          ls -la vendor/boring_tls/prebuilt/${{ matrix.target }}/

      - name: Build zpq
        if: steps.check-ci.outputs.found != 'true'
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast --summary all

          # Show binary info
          ls -la zig-out/bin/
          file zig-out/bin/zpq || true

      - name: Package CLI
        run: |
          mkdir -p dist
          cp zig-out/bin/zpq dist/
          cd dist
          tar -czvf ${{ matrix.artifact }}.tar.gz zpq
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Package Lambda
        if: matrix.lambda_arch != ''
        run: |
          # Rename zpq to bootstrap and zip for Lambda
          cp zig-out/bin/zpq dist/bootstrap
          cd dist
          zip zpq-lambda-${{ matrix.lambda_arch }}.zip bootstrap
          shasum -a 256 zpq-lambda-${{ matrix.lambda_arch }}.zip > zpq-lambda-${{ matrix.lambda_arch }}.zip.sha256
          rm bootstrap

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz*

      - name: Upload Lambda artifact
        if: matrix.lambda_arch != ''
        uses: actions/upload-artifact@v4
        with:
          name: zpq-lambda-${{ matrix.lambda_arch }}
          path: dist/zpq-lambda-${{ matrix.lambda_arch }}.zip*

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ZPQ ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: release/*
          body: |
            ## ZPQ ${{ steps.tag.outputs.tag }}

            ### Downloads

            **CLI Binary:**
            | Platform | Download |
            |----------|----------|
            | Linux x86_64 | [zpq-linux-x86_64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/zpq-linux-x86_64.tar.gz) |
            | Linux ARM64 | [zpq-linux-arm64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/zpq-linux-arm64.tar.gz) |
            | macOS x86_64 | [zpq-macos-x86_64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/zpq-macos-x86_64.tar.gz) |
            | macOS ARM64 | [zpq-macos-arm64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/zpq-macos-arm64.tar.gz) |

            **AWS Lambda:**
            | Architecture | Download |
            |--------------|----------|
            | ARM64 (Graviton) | [zpq-lambda-arm64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/zpq-lambda-arm64.zip) |
            | x86_64 | [zpq-lambda-x86_64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/zpq-lambda-x86_64.zip) |

            ### Quick Start

            ```bash
            # Download and extract (Linux ARM64 example)
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/zpq-linux-arm64.tar.gz | tar -xz

            # View schema
            ./zpq myfile.parquet --schema

            # Filter and output
            ./zpq input.parquet output.parquet --filter "status=active" --select "id,name,email"
            ```

            ### Lambda Deployment

            ```bash
            # Download Lambda zip
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/zpq-lambda-arm64.zip

            # Deploy to AWS
            aws lambda create-function \
              --function-name zpq-filter \
              --runtime provided.al2023 \
              --handler bootstrap \
              --architectures arm64 \
              --zip-file fileb://zpq-lambda-arm64.zip \
              --role arn:aws:iam::YOUR_ACCOUNT:role/YOUR_LAMBDA_ROLE
            ```
