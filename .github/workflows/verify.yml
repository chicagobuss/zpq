name: Verify

# The main Linux x86 job verifies the
# things that, if broken, mean a real user has a bad day:
#   1. Both binaries compile (CLI + Lambda), and the lean-core CLI
#      (-Dsql=false) compiles too and is genuinely SQL-free.
#   2. The Lambda binary is a Lambda binary (identity check — catches
#      the deploy-bug class where aws.sh packaged the CLI by mistake).
#   3. Unit tests pass.
#   4. Lambda integration tests pass (real binary against in-process fake).
#   5. CLI roundtrips a parquet through filter/select/projection and
#      pyarrow can read the output (cross-impl correctness).
#   6. Conformance against the apache parquet-testing corpus, with a
#      regression floor: hard failures (crash / wrong shape / wrong
#      row counts) always fail; the full-pass count must not drop
#      below the recorded baseline (72: legacy LZ4 joined the 69).
#
# A separate native matrix builds and runs Linux x86, Linux ARM and Apple
# silicon release artifacts. Intel macOS runtime coverage is deferred by name.

on:
  push:
    branches: [main]
    paths:
      - "**.zig"
      - "build.zig.zon"
      - "src/cli/help.txt"
      - "packaging/**"
      - "vendor/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.zig"
      - "build.zig.zon"
      - "src/cli/help.txt"
      - "packaging/**"
      - "vendor/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Was 10 min; bumped 2026-05-07 after a string of timeouts when
    # the cache was cold + ziglang.org was returning 500s. Compile
    # itself is ~5 min on the runner; the rest is setup + downstream
    # checks. Real headroom matters more than aspirational tightness.
    # 25 since libzpq joined: its BoringSSL is compiled from source (position-independent), a few minutes cold.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # mlugg/setup-zig uses community-zig-builds with multi-mirror
      # fallback. Switched from raw anyzig install on 2026-05-07 after
      # ziglang.org returned HTTP 500 on a Zig 0.16.0 tarball download
      # and hung the runner for the full job budget. anyzig downloads
      # the *exact* tarball from ziglang.org with no fallback; setup-zig
      # has redundancy.
      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Create Python test environment
        # pyarrow>=21 recognizes the GEOMETRY/GEOGRAPHY logical type. The
        # pinned corpus SHA ships 10 geospatial fixtures; pyarrow 18 fails to
        # *open* them ("Thrift LogicalType not recognized") — not a zpq issue,
        # but it dropped the conformance oracle below the floor. zpq reads all
        # 10 correctly (WKB as BYTE_ARRAY); a current pyarrow lets the floor
        # (72) count them. Bump deliberately alongside the corpus SHA.
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --no-input "pyarrow==24.*" duckdb
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache Zig global build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          # mlugg/setup-zig handles Zig-binary caching itself; we
          # only need to cache the *build* artifacts here. Cache key
          # is keyed on build.zig + build.zig.zon + vendor build.zigs
          # so a meaningful build-graph change invalidates correctly.
          key: ${{ runner.os }}-x86_64-zig-${{ hashFiles('build.zig', 'build.zig.zon', 'vendor/*/build.zig') }}
          restore-keys: ${{ runner.os }}-x86_64-zig-

      - name: Check generated CLI documentation
        run: python3 tools/generate_cli_docs.py --check

      - name: Check the release archive ships every doc its help and guides name
        run: python3 tools/package_release.py --check-docs

      - name: Test CLI inspection
        run: zig build test-cli --summary all -j8

      # Step 1: builds zpq + zpq-lambda for native linux-x86_64. The build
      # downloads the pinned BoringSSL prebuilts (sha256-checked against
      # vendor/boring_tls/prebuilt.sha256) and keeps them in .zig-cache.
      # Default build = SQL-enabled CLI (-Dsql defaults true) + Lambda.
      - name: Build (debug)
        run: zig build --summary all

      # Step 1b: the lean-core build (-Dsql=false). "Build the binary you
      # want" is a real promise only if CI keeps the minimal path compiling
      # and genuinely SQL-free. Built into a separate prefix so it can't
      # clobber the default artifacts the identity checks below inspect.
      - name: Build minimal CLI (no SQL frontend)
        run: |
          zig build -Dsql=false cli --prefix zig-out-minimal --summary all
          # Must reject `query` with a clear error — not crash, and not
          # silently accept SQL (which would mean the frontend leaked in).
          if zig-out-minimal/bin/zpq query --query "SELECT 1 FROM t" 2>err.txt; then
            echo "FAIL: minimal CLI accepted a SQL query"; cat err.txt; exit 1
          fi
          grep -q "no SQL frontend" err.txt || { echo "FAIL: minimal CLI gave the wrong error"; cat err.txt; exit 1; }

      # Step 2: lambda binary identity check. Catches today's deploy-bug
      # class — aws.sh used to package zig-out/bin/zpq (the CLI) as
      # `bootstrap`, which exits right away on Lambda. This guard makes
      # that fail at PR time, not on first invoke.
      - name: Lambda binary identity check
        run: |
          test -x zig-out/bin/zpq-lambda
          file zig-out/bin/zpq-lambda | grep -q "ELF.*executable"
          # The Lambda Runtime API path string ONLY appears in the lambda
          # binary's invocation loop. If this isn't present, we packaged
          # the wrong artifact.
          grep -aFq "/2018-06-01/runtime/invocation/" zig-out/bin/zpq-lambda
          # Negative test: this string MUST NOT appear in the CLI binary.
          if grep -aFq "/2018-06-01/runtime/invocation/" zig-out/bin/zpq; then
            echo "FAIL: CLI binary contains lambda-runtime symbols (binary mix-up?)"
            exit 1
          fi

      # Step 3: also build the Lambda binary the way `aws.sh build` does
      # — cross-compile to x86_64-linux-musl with ReleaseFast — so the
      # identity check above also covers the deploy artifact, not just
      # the dev-build artifact.
      - name: Build Lambda deploy artifact (musl, ReleaseFast)
        run: ./tools/serverless/aws.sh build x86_64

      - name: Lambda deploy artifact identity check
        run: |
          # Unzip and inspect the bootstrap that would actually be sent
          # to AWS. Same checks as above.
          mkdir -p /tmp/lambda-check
          unzip -q zig-out/lambda/zpq-lambda-x86_64.zip -d /tmp/lambda-check
          file /tmp/lambda-check/bootstrap | grep -q "ELF.*executable"
          file /tmp/lambda-check/bootstrap | grep -q "statically linked"
          grep -aFq "/2018-06-01/runtime/invocation/" /tmp/lambda-check/bootstrap

      # The oracle: DuckDB 2.0's CLI, pinned by the archive's sha256.
      - name: Install DuckDB 2.0
        run: |
          mkdir -p ~/.cache/zpq-duckdb2/bin-2.0.0 && cd ~/.cache/zpq-duckdb2
          curl -fsSLo cli.tar.gz https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz
          echo "c6507206baf7793c6013dbd82368469a45f20dc0e17a6f92f204602f652ed2bc  cli.tar.gz" | sha256sum -c -
          tar -xzf cli.tar.gz -C bin-2.0.0 duckdb

      # The commit tier, then every full-tier shard but ClickBench (its 14 GB partitions live on the fleet). Each
      # writes receipts; each `check` step fails unless its verdict passes for this SHA.
      - name: Commit tier
        run: zig build check -Dtier=commit -j8
      - name: Full tier (units, integration, uncached cases, corpus, OS contracts, libzpq)
        run: |
          for shard in units-core units cases corpus os libzpq; do
            zig build check -Dtier=full -Dshard=$shard -j8
          done

      - name: Keep the receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipts
          path: zig-out/receipts

  # Each native job runs its installed CLI and, on Linux, Lambda artifacts.
  release-smoke:
    name: Native release smoke (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
          - runner: macos-14
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The shipped CLI, built as it ships, through the release cases on its own platform.
      - name: Build and smoke the release artifacts
        run: |
          zig build -j8 -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dstrip=true -Drevision=$GITHUB_SHA \
            --prefix zig-out/release cli lambda
          zig-out/release/bin/zpq --version | grep -q "$GITHUB_SHA"
          zig build check-runner -Doptimize=ReleaseSafe -j8
          zig-out/bin/zpq-check --cases tools/check/cases/release.json --zpq zig-out/release/bin/zpq --no-cache

      - name: Lambda against the fake runtime
        if: runner.os == 'Linux'
        run: zig build test-integration -Doptimize=ReleaseFast -j8
