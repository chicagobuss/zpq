# Lambda RIE with io_uring BLOCKED (forces epoll fallback)
# Simulates Lambda's older kernel that doesn't support io_uring
#
# Usage:
#   cd benchmarks && docker-compose -f docker-compose.no-io-uring.yml up --build -d

services:
  lambda-bench:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:8080"
    environment:
      - AWS_REGION=us-west-2
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    volumes:
      - /tmp/zpq_r2_bucket/benchmark:/data:ro
      - /tmp:/tmp
    security_opt:
      - seccomp=./no-io-uring.json
