[package]
name = "rust-arrow-filter"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_runtime = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-config = "1.5"
aws-sdk-s3 = "1.65"
parquet = { version = "53", features = ["arrow"] }
arrow = "53"
arrow-select = "53"
bytes = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
