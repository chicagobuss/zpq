services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001" --address ":9000"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    volumes:
      - ./data:/data
      - ./certs:/root/.minio/certs
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 5

  # MinIO Client (mc) for setup/tracing
  mc:
    image: minio/mc
    volumes:
      - ../../ci/fixtures/minio:/fixtures:ro
    # No entrypoint, we'll use 'run' or 'exec'

